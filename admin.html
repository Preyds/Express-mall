<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExpressMall | Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 font-sans p-4 max-w-xl mx-auto space-y-6">

  <!-- SECURITY PIN LOGIN SCREEN -->
  <div id="pinModal" class="fixed inset-0 bg-gray-950/95 z-50 flex items-center justify-center p-6">
    <div class="bg-gray-900 w-full max-w-sm rounded-2xl p-6 shadow-2xl border border-gray-800 space-y-5 text-center">
      <div class="flex flex-col items-center gap-2">
        <i data-lucide="lock" class="w-10 h-10 text-orange-400"></i>
        <h2 class="text-lg font-bold text-white uppercase tracking-wider">Admin Dashboard Access</h2>
        <p class="text-xs text-gray-400">Please enter your secure 4-digit PIN.</p>
      </div>
      
      <form id="pinForm" onsubmit="checkAdminPIN(event)" class="space-y-4">
        <div>
          <input type="password" id="enteredPin" maxlength="4" required placeholder="••••" 
                 class="w-full mt-1 px-4 py-3 bg-gray-800 border border-gray-700 rounded-lg text-white text-center text-lg font-bold tracking-[1em] focus:outline-none focus:border-orange-500 placeholder-gray-600 shadow-inner">
        </div>
        
        <div class="grid grid-cols-2 gap-3">
          <a href="index.html" class="flex-1 text-center bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold py-2.5 rounded-lg text-xs uppercase shadow transition">
            Storefront
          </a>
          <button type="submit" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-2.5 rounded-lg text-xs uppercase shadow transition">
            Unlock
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL CONTENT -->
  <div id="adminPanelContent" class="hidden space-y-6">
    <header class="flex items-center justify-between border-b pb-3">
      <h1 class="text-xl font-black text-gray-800 uppercase flex items-center gap-2">
        <i data-lucide="shield-check" class="text-orange-500"></i> Admin Panel
      </h1>
      <a href="index.html" class="text-xs font-bold text-orange-600 hover:underline flex items-center gap-1">
        <i data-lucide="external-link" class="w-3.5 h-3.5"></i> View Store
      </a>
    </header>

    <div class="bg-white rounded-xl shadow-md p-5 space-y-4">
      <h2 class="text-sm font-bold text-gray-700 uppercase">Upload New Product</h2>
      
      <form id="addProductForm" onsubmit="handleUploadProduct(event)" class="space-y-3">
        <div>
          <label class="text-xs font-bold text-gray-600 uppercase">Product Title *</label>
          <input type="text" id="title" required placeholder="e.g., Men Casual Sneakers" 
                 class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-orange-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-bold text-gray-600 uppercase">Price (₦) *</label>
            <input type="number" id="price" required placeholder="25000" 
                   class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-orange-500">
          </div>
          <div>
            <label class="text-xs font-bold text-gray-600 uppercase">Old Price (₦)</label>
            <input type="number" id="old_price" placeholder="30000" 
                   class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-orange-500">
          </div>
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 uppercase">Direct Image URL *</label>
          <input type="url" id="image_url" required oninput="previewImage(this.value)" placeholder="https://i.ibb.co/.../image.jpg" 
                 class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-orange-500">
          <p class="text-[10px] text-gray-400 mt-1">Make sure link ends in .jpg, .png or .webp</p>
        </div>

        <!-- Live Image Preview Box -->
        <div id="previewContainer" class="hidden space-y-1">
          <label class="text-xs font-bold text-gray-500 uppercase">Image Preview:</label>
          <img id="imagePreview" src="" class="w-24 h-24 object-cover rounded-lg border shadow-inner">
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 uppercase">Available Sizes (Comma separated)</label>
          <input type="text" id="sizes" placeholder="S, M, L, XL or 40, 41, 42" 
                 class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 uppercase">Available Colors (Comma separated)</label>
          <input type="text" id="colors" placeholder="Black, White, Navy Blue" 
                 class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-orange-500">
        </div>

        <div>
          <label class="text-xs font-bold text-gray-600 uppercase">Description</label>
          <textarea id="description" rows="2" placeholder="Brief description..." 
                    class="w-full mt-1 px-3 py-2 border rounded-lg text-sm focus:outline-none focus:border-orange-500"></textarea>
        </div>

        <button type="submit" id="submitBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg text-xs uppercase shadow transition">
          Publish Product
        </button>
      </form>
    </div>

    <div class="bg-white rounded-xl shadow-md p-5 space-y-3">
      <h2 class="text-sm font-bold text-gray-700 uppercase">Manage Inventory</h2>
      <div id="adminProductList" class="space-y-3"></div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = '1234';

    window.onload = function() {
      document.getElementById('enteredPin').focus();
    };

    function checkAdminPIN(e) {
      e.preventDefault();
      const enteredValue = document.getElementById('enteredPin').value;
      if (enteredValue === ADMIN_PIN) {
        unlockAdminPanel();
      } else {
        alert('Access Denied! Incorrect PIN.');
        document.getElementById('pinForm').reset();
        document.getElementById('enteredPin').focus();
      }
    }

    function unlockAdminPanel() {
      document.getElementById('pinModal').classList.add('hidden');
      document.getElementById('adminPanelContent').classList.remove('hidden');
      loadAdminProducts();
    }

    function previewImage(url) {
      const previewContainer = document.getElementById('previewContainer');
      const previewImg = document.getElementById('imagePreview');
      if (url.trim().length > 5) {
        previewImg.src = url;
        previewContainer.classList.remove('hidden');
      } else {
        previewContainer.classList.add('hidden');
      }
    }

    const SUPABASE_URL = 'https://lpkyznjbkfofvmwqxaha.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jqVK03Q3Q5I9Dgnesw0RsA_qE2O7BnS';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    lucide.createIcons();

    async function loadAdminProducts() {
      const list = document.getElementById('adminProductList');
      const { data: products, error } = await _supabase.from('products').select('*').order('created_at', { ascending: false });
      
      if (error || !products) {
        list.innerHTML = `<p class="text-xs text-red-500">Error loading inventory.</p>`;
        return;
      }

      list.innerHTML = products.map(p => `
        <div class="flex items-center gap-3 border-b pb-3">
          <img src="${p.image_url}" class="w-12 h-12 object-cover rounded">
          <div class="flex-1">
            <h5 class="text-xs font-bold text-gray-800 line-clamp-1">${p.title}</h5>
            <p class="text-[11px] text-gray-500">₦${p.price.toLocaleString()}</p>
          </div>
          <button onclick="deleteProduct('${p.id}')" class="text-red-500 hover:text-red-700 p-2">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    async function handleUploadProduct(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.innerText = 'Publishing...';
      submitBtn.disabled = true;

      const title = document.getElementById('title').value;
      const price = parseFloat(document.getElementById('price').value);
      const old_price = document.getElementById('old_price').value ? parseFloat(document.getElementById('old_price').value) : null;
      const image_url = document.getElementById('image_url').value;
      const description = document.getElementById('description').value;

      const sizesRaw = document.getElementById('sizes').value;
      const colorsRaw = document.getElementById('colors').value;

      const sizes = sizesRaw ? sizesRaw.split(',').map(s => s.trim()) : [];
      const colors = colorsRaw ? colorsRaw.split(',').map(c => c.trim()) : [];

      const { error } = await _supabase.from('products').insert([{
        title, price, old_price, image_url, description, sizes, colors
      }]);

      submitBtn.innerText = 'Publish Product';
      submitBtn.disabled = false;

      if (error) {
        alert('Error publishing product: ' + error.message);
      } else {
        alert('Product published successfully!');
        document.getElementById('addProductForm').reset();
        document.getElementById('previewContainer').classList.add('hidden');
        loadAdminProducts();
      }
    }

    async function deleteProduct(id) {
      if (!confirm('Are you sure you want to delete this product?')) return;
      const { error } = await _supabase.from('products').delete().eq('id', String(id));
      if (error) {
        alert('Failed to delete item: ' + error.message);
      } else {
        alert('Product deleted successfully!');
        loadAdminProducts();
      }
    }
  </script>
</body>
</html>
